# Example Jupiter solver configuration.
# Run with: solana-solvers jupiter --config <this file>

# Orders quoted at once. Each quote is two sequential Jupiter requests, three
# when the engine has to price the buy token itself.
concurrent-requests = 8
# Pause after a rate-limited response: min-back-off at first, multiplied by
# back-off-growth-factor per consecutive one, capped at max-back-off.
back-off-growth-factor = 2.0
min-back-off = "1s"
max-back-off = "8s"

[dex]
# Jupiter swap API base URL: api.jup.ag, or a Triton-hosted endpoint.
endpoint = "https://api.jup.ag"
# API key from the Jupiter developer portal (or Triton). Works without one but
# heavily rate-limited, set it for production.
api-key = "your-jupiter-api-key"
# Slippage tolerance in basis points, sent to Jupiter as slippageBps. 50 = 0.5%.
slippage-bps = 50
# Serve buy orders via ExactOut swaps. Off by default.
enable-buy-orders = false
