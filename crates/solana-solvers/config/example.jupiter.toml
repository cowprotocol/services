# Example Jupiter solver configuration.
# Run with: solana-solvers jupiter --config <this file>

# Orders quoted at once. Each quote is one Jupiter request.
concurrent-requests = 8
# Pause after a rate-limited response: min-back-off at first, multiplied by
# back-off-growth-factor per consecutive one, capped at max-back-off.
back-off-growth-factor = 2.0
min-back-off = "1s"
max-back-off = "8s"
# The most orders one batched solution fills. 1 disables batching: each pair
# then quotes only its most permissive sell order.
max-batch-size = 4

[dex]
# Jupiter swap API (v2) base URL. Sell orders only: v2 has no ExactOut.
endpoint = "https://api.jup.ag"
# API key from the Jupiter developer portal. Works without one but heavily
# rate-limited, set it for production.
api-key = "your-jupiter-api-key"
# Slippage tolerance in basis points, sent to Jupiter as slippageBps. Bids use
# Jupiter's otherAmountThreshold, so this is how far below its expected output
# they land. 50 = 0.5%.
slippage-bps = 50
