[package]
name = "solana-solvers"
version = "0.1.0"
edition = "2024"
description = "Solana solver engines for CoW Protocol (Jupiter dex-wrapper)"
license = "GPL-3.0-or-later"

[lib]
name = "solana_solvers"
path = "src/lib.rs"

[[bin]]
name = "solana-solvers"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, default-features = false, features = ["clock"] }
clap = { workspace = true, features = ["derive", "env"] }
configs = { workspace = true }
const-hex = { workspace = true }
futures = { workspace = true }
humantime-serde = { workspace = true }
observe = { workspace = true }
rate-limit = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_with = { workspace = true }
solana-sdk = { workspace = true }
spl-token-interface = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "signal", "time"] }
toml = { workspace = true }
tower-http = { workspace = true, features = ["limit"] }
tracing = { workspace = true }
url = { workspace = true, features = ["serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
