# The mainnet protocol-fee config as fee-engine rules.
#
# Read from prod mainnet `fee_policies`, auctions 14108381-14115223 (the last
# 7000 on 2026-10-27), as per-order policy sequences:
#
#   WITH recent AS (SELECT max(id) - 7000 AS min_id FROM auctions),
#   p AS (
#     SELECT auction_id, order_uid, application_order,
#            kind::text || '(' || COALESCE(CASE kind::text
#              WHEN 'volume' THEN volume_factor::text
#              WHEN 'surplus' THEN surplus_factor::text || ',' || surplus_max_volume_factor::text
#              WHEN 'priceimprovement' THEN price_improvement_factor::text || ',' || price_improvement_max_volume_factor::text
#            END, '?') || ')' AS pol
#     FROM fee_policies, recent WHERE auction_id >= recent.min_id),
#   s AS (SELECT auction_id, order_uid, string_agg(pol, ' > ' ORDER BY application_order) AS seq
#         FROM p GROUP BY 1, 2)
#   SELECT seq, count(*) AS orders FROM s GROUP BY seq ORDER BY orders DESC;
#
# Every sequence is: price_improvement(0.5, 0.0098) if in market, else
# surplus(0.5, 0.0098); then volume(0.0002), or volume(3e-05) when both tokens
# are in one bucket, or nothing on same-token and WETH -> ETH; then partner
# fees from app-data, which the host appends after these rules. Owners in
# `surplus-capturing-jit-order-owners` have no rows. The two bucket lists are
# the prod `volume-fee-bucket-overrides` (infra render of 2026-10-15); infra
# owns them, this copy exists for tests/load.rs.
#
# `order.class` serializes as "limit" for every order until M2 sets it. The
# native token is the lowercase literal 0xeeee...eeee.

