# Protocol fee rules. Rules are tried top to bottom; the first `when` that is
# true wins, so put specific rules above general ones.

[lists]
stablecoins = [
  "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48", # USDC
  "0xdAC17F958D2ee523a2206206994597C13D831ec7", # USDT
  "0x6B175474E89094C44Da98b954EedeAC495271d0F", # DAI
]
eth_lsts = [
  "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2", # WETH
  "0xae7ab96520DE3A18E5e111B5EaAb095312D7fE84", # stETH
  "0x7f39C581F595B53c5cb19bD0b3f8dA6c935E2Ca0", # wstETH
]
jit_makers = ["0x1111111111111111111111111111111111111111"]
acme_treasury = ["0x2222222222222222222222222222222222222222"]
acme_tokens = ["0x3333333333333333333333333333333333333333"]

[partners]
acme = { signers = ["0x7E5F4552091A69125d5DfCb7b8C2659029395Bdf"] }

[[rule]]
name = "Exempt JIT makers"
when = 'order.owner in jit_makers'
fee  = 'no_fee()'

[[rule]]
name = "Acme treasury and ops wallets"
when = 'order.owner in acme_treasury'
fee  = 'no_fee()'

[[rule]]
name = "Acme launch month"
when = 'partner == "acme" && now < timestamp("2026-12-01T00:00:00Z")'
fee  = 'no_fee()'

[[rule]]
name = "Acme staging app"
when = 'partner == "acme" && order.appData.environment == "staging"'
fee  = 'no_fee()'

[[rule]]
name = "Aave flashloan collateral swaps"
when = 'order.appData.appCode == "aave" && order.appData.metadata.flashloan != null'
fee  = 'volume(20)'

[[rule]]
name = "Aave stablecoin swaps"
when = 'order.appData.appCode == "aave" && order.sellToken in stablecoins && order.buyToken in stablecoins'
fee  = 'volume(15)'

[[rule]]
name = "Acme smart-wallet orders"
when = 'partner == "acme" && order.signingScheme == "eip1271"'
fee  = 'volume(5)'

[[rule]]
name = "Acme token trades"
when = 'partner == "acme" && (order.sellToken in acme_tokens || order.buyToken in acme_tokens)'
fee  = 'volume(5)'

[[rule]]
name = "Acme base rate"
when = 'partner == "acme"'
fee  = 'volume(size_usd >= 1e6 ? 5 : 10)'

[[rule]]
name = "Beta blended fee"
when = 'order.appData.appCode == "beta"'
fee  = '[surplus(30, 1), volume(2)]'

[[rule]]
name = "Correlated pairs"
when = 'order.sellToken in eth_lsts && order.buyToken in eth_lsts'
fee  = 'volume(1)'

[[rule]]
name = "Stablecoin swaps"
when = 'order.sellToken in stablecoins && order.buyToken in stablecoins'
fee  = 'volume(10)'

[[rule]]
name = "Default"
when = 'true'
fee  = 'surplus(50, 1)'
