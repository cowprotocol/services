[package]
name = "chain-types"
version = "0.1.0"
edition = "2024"
description = "Per-chain type vocabulary and arithmetic traits for chain-generic protocol logic"

[dependencies]
alloy-primitives = { workspace = true }
anyhow = { workspace = true }
