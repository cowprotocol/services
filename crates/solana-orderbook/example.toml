# Example configuration for the Solana orderbook.

[database]
# The Postgres database the indexer writes to. Reads prefer read-url when set,
# and a value like "%DB_READ_URL" reads the URL from that environment variable.
write-url = "postgresql://"
# read-url = "%DB_READ_URL"

[http]
bind-address = "0.0.0.0:8080"

[quoting]
# The drivers asked to quote orders. The best answer wins.
drivers = ["http://localhost:8000"]
# The autopilot, whose native prices gate quotes: a pair with a token no
# estimator prices answers NoLiquidity.
autopilot = "http://localhost:12088"
# How long the driver has to answer. Defaults to 5s.
# timeout = "5s"
# Bounds on an order's validTo, for quotes and sponsored placement, and
# how long the quoted amounts are honored.
# min-validity = "1m"
# max-validity = "1y"
# quote-expiry = "1m"
# Drivers a priceQuality: fast quote waits for before it answers with the
# best of them. Defaults to 2.
# fast-results-required = 2

[logging]
filter = "info,solana_orderbook=debug"
# stderr-threshold = "warn"
# use-json = false

# The Solana JSON-RPC node. Required by sponsored order placement.
# [rpc]
# endpoint = "https://api.mainnet-beta.solana.com"
# Ceiling on one RPC request. Defaults to 5s.
# request-timeout = "5s"

# Sponsored order placement. Omit the section to disable POST /api/v1/orders.
# [sponsoring]
# The funding account creation transactions must name as their fee payer.
# funder = "9VXC6LH9eXMBpXLQnxMYAGkjs59Zon2ACciJwQ6iMzNB"
# The most the funder pays in priority fee for one creation, in lamports.
# Defaults to 100000.
# max-priority-fee-lamports = 100000

# Quote verification: each driver's quoted settlement is simulated behind the
# quoted order's creation. Omit the section to leave every quote unverified.
# Requires the [rpc] section.
# [quote-verification]
# Whether a verified quote outranks an unverified one: "unverified" (the
# default, the amounts alone rank) or "prefer".
# mode = "prefer"
# A node with the Jito simulateBundle extension.
# bundle-endpoint = "https://bundles.example.com"
# A node serving getTokenLargestAccounts, which needs the spl-token-mint
# account index. Without it, quotes selling a mint without a mint authority
# stay unverified.
# holders-endpoint = "https://solana-mainnet.g.alchemy.com/v2/<key>"
# The share of the sell or buy amount the settlement program's buffers may
# pay before the quote is dropped. Defaults to 1.
# quote-inaccuracy-limit = 0.000001
