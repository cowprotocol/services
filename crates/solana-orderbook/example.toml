# Example configuration for the Solana orderbook.

[database]
# The Postgres database the indexer writes to. Reads prefer read-url when set,
# and a value like "%DB_READ_URL" reads the URL from that environment variable.
write-url = "postgresql://"
# read-url = "%DB_READ_URL"

[http]
bind-address = "0.0.0.0:8080"

[quoting]
# The drivers asked to quote orders. The best answer wins.
drivers = ["http://localhost:8000"]
# How long the driver has to answer. Defaults to 5s.
# timeout = "5s"
# Bounds on a quoted order's validTo and how long the amounts are honored.
# min-validity = "2m"
# max-validity = "2h"
# quote-expiry = "1m"

[logging]
filter = "info,solana_orderbook=debug"
# stderr-threshold = "warn"
# use-json = false
