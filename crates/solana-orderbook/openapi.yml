openapi: 3.0.3
info:
  title: Solana Order Book API
  description: |
    Read-only API over the orders and settlements the indexer records from the
    Solana settlement program.
  version: 0.0.1
servers:
  - description: Solana (Staging)
    url: "https://barn.api.cow.fi/solana"
paths:
  /api/v1/account/{owner}/orders:
    get:
      operationId: getUserOrdersPaginated
      description: |
        The owner's orders, sorted by creation date descending (newest first).
        To enumerate all orders start with `offset` 0 and keep increasing it
        by the number of returned results. A response shorter than `limit` is
        the last page.
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Pubkey"
        - name: offset
          in: query
          description: The pagination offset. Defaults to 0.
          schema:
            type: integer
          required: false
        - name: limit
          in: query
          description: The pagination limit. Defaults to 10. Maximum 1000. Minimum 1.
          schema:
            type: integer
          required: false
      responses:
        "200":
          description: The orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "400":
          description: |
            The owner is not a valid public key (`InvalidOwner`) or the limit
            is out of bounds (`LIMIT_OUT_OF_BOUNDS`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/orders/{uid}:
    get:
      operationId: getOrder
      description: |
        One order with its fill state.
      parameters:
        - name: uid
          in: path
          required: true
          description: The order's 32-byte intent hash as hex.
          schema:
            $ref: "#/components/schemas/OrderUid"
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: The uid is not 32 bytes of hex.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No order with this uid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/orders/{uid}/status:
    get:
      operationId: getOrderStatus
      description: |
        The order's auction progress. A trade always reports `traded`. An
        untraded order reports `cancelled` or `expired` when the order's own
        `status` says so. Otherwise the latest auction event decides, and an
        indexed order without events is `scheduled`.
      parameters:
        - name: uid
          in: path
          required: true
          description: The order's 32-byte intent hash as hex.
          schema:
            $ref: "#/components/schemas/OrderUid"
      responses:
        "200":
          description: The auction progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionOrderStatus"
        "400":
          description: The uid is not 32 bytes of hex.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No order with this uid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v2/trades:
    get:
      operationId: getTrades
      description: |
        Trades of one order or one owner, newest first. Exactly one of
        `orderUid` and `owner` must be set. To enumerate all trades start
        with `offset` 0 and keep increasing it by the number of returned
        results. A response shorter than `limit` is the last page.
      parameters:
        - name: orderUid
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderUid"
        - name: owner
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Pubkey"
        - name: offset
          in: query
          description: The pagination offset. Defaults to 0.
          schema:
            type: integer
          required: false
        - name: limit
          in: query
          description: The pagination limit. Defaults to 10. Maximum 1000. Minimum 1.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
          required: false
      responses:
        "200":
          description: The trades, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"
        "400":
          description: |
            Both or neither filter set (`InvalidTradeFilter`), a malformed
            filter value (`InvalidOrderUid`, `InvalidOwner`), or the limit
            out of bounds (`InvalidLimit`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v2/solver_competition/{auction_id}:
    get:
      operationId: getSolverCompetitionByAuctionIdV2
      description: |
        The competition of one auction: the auction snapshot, every proposed
        solution ranked, and the settlements. A competition is hidden until
        the indexer passes the auction's deadline slot, the last slot in
        which the winners may submit their settlements. A transaction they
        sent before it may still land afterwards.
      parameters:
        - name: auction_id
          in: path
          required: true
          description: The auction id the solvers were given.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: The competition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolverCompetitionResponse"
        "400":
          description: |
            The auction id is not a non-negative integer
            (`InvalidAuctionId`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: |
            No competition for this auction id, or its deadline slot has not
            passed yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v2/solver_competition/by_tx_hash/{tx_hash}:
    get:
      operationId: getSolverCompetitionByTxHashV2
      description: |
        The competition one settlement transaction executed. The path keeps
        the EVM orderbook's name, the parameter is the transaction's
        signature.
      parameters:
        - name: tx_hash
          in: path
          required: true
          description: The signature of a settlement transaction.
          schema:
            $ref: "#/components/schemas/Signature"
      responses:
        "200":
          description: The competition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolverCompetitionResponse"
        "400":
          description: |
            The parameter is not a base58-encoded signature
            (`InvalidTransactionSignature`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: |
            No settlement with this signature attributed to a solution, or
            its auction's deadline slot has not passed yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v2/solver_competition/latest:
    get:
      operationId: getSolverCompetitionLatestV2
      description: |
        The most recent competition whose deadline slot the indexer has
        passed.
      responses:
        "200":
          description: The competition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolverCompetitionResponse"
        "404":
          description: No competition has passed its deadline slot yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/orders:
    post:
      operationId: createOrder
      description: |
        Place a sponsored order: the body carries the user's partially signed
        creation transaction (owner signed, the deployment's funder as its
        unsigned fee payer), and every order field derives from its trailing
        `CreateOrder` instruction. In front of it the transaction carries the
        preparation steps, in this order: create the wSOL account, fund it,
        sync it, approve the settlement delegate, and create the buy token
        account (idempotent, a no-op when the account already exists), each
        omittable (the wrap steps only for native SOL sells). Without the
        creation, the buy token account must already receive the buy mint or
        be the owner's associated token account, which the settlement
        creates when missing: a custom receiver's missing account needs the
        creation. An order buying native SOL skips the creation, its payout
        goes to the wallet. The order competes in auctions until the
        transaction's blockhash expires (about a minute) or it settles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partiallySignedTx]
              properties:
                partiallySignedTx:
                  description: |
                    The creation transaction in wire format, base64. Only the
                    autopilot holds the key of the funder (the sponsor
                    account), so the client never signs it in full. To build
                    it:

                    1. Read the funder address from the `funder` field of
                       `POST /api/v1/quote`.
                    2. Make the funder the fee payer (the first account key)
                       and the `created_by` rent payer of `CreateOrder`.
                       Address lookup tables are not accepted.
                    3. Sign with the order owner's key only. The funder's
                       signature slot stays 64 zero bytes until the autopilot
                       countersigns the transaction for the auction the order
                       wins.
                    4. Serialize the transaction with its signatures and
                       base64-encode it. With `@solana/web3.js` 1.x, a legacy
                       `Transaction` needs
                       `serialize({ requireAllSignatures: false })`.
                  type: string
                quoteId:
                  description: |
                    The id the quote endpoint answered for this order. Stored
                    with the order when the quote matches it, dropped
                    otherwise.
                  type: integer
                  format: int64
                  nullable: true
                appData:
                  description: |
                    AppData which will be assigned to the order: the full
                    `appData` document whose keccak256 hash the `CreateOrder`
                    intent carries in `app_data`, stored with the order and
                    served as its `fullAppData`, or that hash once the document
                    is registered through `PUT /api/v1/app_data`. The intent's
                    hash when omitted.
                  oneOf:
                    - $ref: "#/components/schemas/AppData"
                    - $ref: "#/components/schemas/AppDataHash"
                appDataHash:
                  description: |
                    The hash of the stringified JSON `appData` doc. If present,
                    `appData` must be the document this hash is derived from.
                    In case they differ, the call will fail.
                  allOf:
                    - $ref: "#/components/schemas/AppDataHash"
      responses:
        "201":
          description: The order uid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderUid"
        "400":
          description: |
            Sponsoring disabled on this deployment (`SponsoringDisabled`), an
            undecodable or wrongly shaped transaction (`InvalidTransaction`),
            a fee or rent payer other than the funder (`WrongFeePayer`,
            `WrongRentPayer`), a PDA not derived from the intent
            (`WrongOrderPda`), a delegation not targeting the settlement
            state PDA (`WrongDelegate`), equal mints or wSOL sold for native SOL
            (`SameBuyAndSellToken`), a zero amount (`ZeroAmount`), a native
            SOL buy paying an account the System Program does not own, or
            whose payout can leave the wallet under its rent-exempt minimum,
            890880 lamports for an empty wallet (`InvalidNativeBuy`), a missing
            owner signature (`InvalidSignature`), a validTo below the minimum
            or above the maximum validity (`InsufficientValidTo`,
            `ExcessiveValidTo`), an `appData` document that is not a JSON
            object or exceeds the size limit, or a hash with no registered
            document (`InvalidAppData`), an `appData` document or hash
            disagreeing with its `appDataHash` or the intent's `app_data`
            (`AppDataHashMismatch`), a mint the settlement program
            cannot move (`UnsupportedToken`), a dead blockhash
            (`BlockhashExpired`), or a known uid (`DuplicatedOrder`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/quote:
    post:
      operationId: postQuote
      description: |
        What one order would trade for right now. Indicative: no component
        simulates the settlement, so `verified` is always false and the
        amounts are not a commitment. The amounts are net of the execution
        cost, see `costs`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "200":
          description: The quoted order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteResponse"
        "400":
          description: |
            The body could not be parsed (`InvalidRequestBody`), buy and sell
            token are the same, wSOL for native SOL included
            (`SameBuyAndSellToken`), the amount is zero
            (`ZeroAmount`), an `appData` document that is not a JSON object
            or exceeds the size limit, or a hash with no registered document
            (`InvalidAppData`), an `appDataHash` the document does not hash
            to (`AppDataHashMismatch`), a native SOL buy would leave its
            wallet under the
            rent-exempt minimum, 890880 lamports for an empty wallet
            (`InvalidNativeBuy`),
            `validTo` is closer than the configured minimum
            (default one minute) or further than the configured maximum
            (default one year) (`InsufficientValidTo`, `ExcessiveValidTo`),
            a mint the settlement program cannot move (`UnsupportedToken`),
            a buy token account that exists but cannot take the payout,
            frozen, another mint's, or refusing plain credits
            (`InvalidBuyTokenAccount`), or no quoted amount covers the
            execution cost (`SellAmountDoesNotCoverFee`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: |
            No driver returned a route for the pair, or a token has no native
            price (`NoLiquidity`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/app_data/{app_data_hash}:
    get:
      operationId: getAppDataByHash
      summary: Get the full `appData` from its `appDataHash`.
      parameters:
        - in: path
          name: app_data_hash
          schema:
            $ref: "#/components/schemas/AppDataHash"
          required: true
      responses:
        "200":
          description: Full `appData`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDataObject"
        "400":
          description: Invalid app data hash (`InvalidAppDataHash`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No full `appData` stored for this hash (`NotFound`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: registerAppDataByHash
      summary: Registers a full `appData` so it can be referenced by `appDataHash`.
      description: |
        Uploads a full `appData` to the orderbook so that orders created with
        the corresponding `appDataHash` can be linked to the original full
        `appData`.
      parameters:
        - in: path
          name: app_data_hash
          schema:
            $ref: "#/components/schemas/AppDataHash"
          required: true
      requestBody:
        description: The `appData` document to upload.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppDataObject"
      responses:
        "200":
          description: The full `appData` already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDataHash"
        "201":
          description: The full `appData` was successfully registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDataHash"
        "400":
          description: |
            A document that is not a JSON object or exceeds the size limit
            (`AppDataInvalid`), a document not hashing to the path's hash
            (`AppDataHashMismatch`), a different document already stored
            under the hash (`AppDataMismatch`), a malformed hash
            (`InvalidAppDataHash`), or a body that is not an `AppDataObject`
            (`InvalidRequestBody`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/app_data:
    put:
      operationId: registerAppData
      summary: Registers a full `appData` and returns `appDataHash`.
      description: |
        Uploads a full `appData` to the orderbook and returns the
        corresponding `appDataHash`.
      requestBody:
        description: The `appData` document to upload.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppDataObject"
      responses:
        "200":
          description: The full `appData` already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDataHash"
        "201":
          description: The full `appData` was successfully registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDataHash"
        "400":
          description: |
            A document that is not a JSON object or exceeds the size limit
            (`AppDataInvalid`), a different document already stored under
            its hash (`AppDataMismatch`), or a body that is not an
            `AppDataObject` (`InvalidRequestBody`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/version:
    get:
      operationId: getApiVersion
      summary: Get the API's current deployed version.
      description: |
        The build the API runs as `<ref>@<sha>`: the release tag or branch the
        image was built from and its git commit (code:
        https://github.com/cowprotocol/services).
      responses:
        "200":
          description: Version
          content:
            text/plain: {}
components:
  schemas:
    OrderUid:
      description: The order's 32-byte intent hash as hex.
      type: string
      example: "0x291a7e4327d1c8f8ffd97d290fa0d1d3e60cd71d16bee0a389a15adc7c99f076"
    Pubkey:
      description: A base58-encoded Solana public key.
      type: string
      example: "3JF3sEqM796hk5WFqA6EtmEwJQ9quALszsfJyvXNQKy3"
    TokenAmount:
      description: A token amount in base units as a decimal string.
      type: string
      example: "1000000"
    AppData:
      description: |
        The string encoding of a JSON object representing some `appData`. The
        format of the JSON expected in the `appData` field is defined
        [here](https://github.com/cowprotocol/app-data). The protocol
        `metadata` is stored, not interpreted.
      type: string
      example: '{"version":"0.9.0","metadata":{}}'
    AppDataHash:
      description: |
        32 bytes encoded as hex with `0x` prefix: the keccak256 hash of the
        stringified JSON object representing the `appData`, as the
        `CreateOrder` intent carries it in `app_data`.
      type: string
      example: "0xb48d38f93eaa084033fc5970bf96e559c33c4cdc07d889ab00b4d63f9590739d"
    AppDataObject:
      description: An `appData` document that is registered with the API.
      type: object
      properties:
        fullAppData:
          $ref: "#/components/schemas/AppData"
      required:
        - fullAppData
    OrderKind:
      description: Which amount the order fixes.
      type: string
      enum: [sell, buy]
    OrderStatus:
      description: |
        Lifecycle of the order. A full fill wins over cancellation because
        reclaiming a filled order's account stamps a cancellation timestamp
        without undoing the fill. `expired` covers the intent's `validTo`
        passing and a pending sponsored creation whose transaction died: the
        chain passed its `lastValidBlockHeight` before the creation landed.
      type: string
      enum: [open, fulfilled, cancelled, expired]
    Order:
      description: One order with its fill state.
      type: object
      required:
        - uid
        - owner
        - sellToken
        - buyToken
        - sellTokenAccount
        - buyTokenAccount
        - sellAmount
        - buyAmount
        - validTo
        - kind
        - partiallyFillable
        - appData
        - fullAppData
        - orderPda
        - creationDate
        - executedSellAmount
        - executedBuyAmount
        - status
      properties:
        uid:
          $ref: "#/components/schemas/OrderUid"
        owner:
          $ref: "#/components/schemas/Pubkey"
        sellToken:
          description: The mint of the token being sold.
          allOf:
            - $ref: "#/components/schemas/Pubkey"
        buyToken:
          description: |
            The mint of the token being bought, or the System Program ID
            (`11111111111111111111111111111111`) for native SOL.
          allOf:
            - $ref: "#/components/schemas/Pubkey"
        sellTokenAccount:
          description: The owner's token account the sell tokens are pulled from.
          allOf:
            - $ref: "#/components/schemas/Pubkey"
        buyTokenAccount:
          description: |
            The owner's token account the buy tokens are paid to, or the
            wallet for native SOL.
          allOf:
            - $ref: "#/components/schemas/Pubkey"
        sellAmount:
          $ref: "#/components/schemas/TokenAmount"
        buyAmount:
          $ref: "#/components/schemas/TokenAmount"
        validTo:
          description: Expiry as unix seconds.
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/OrderKind"
        partiallyFillable:
          type: boolean
        appData:
          $ref: "#/components/schemas/AppDataHash"
        fullAppData:
          description: The document `appData` is the hash of, null until registered.
          allOf:
            - $ref: "#/components/schemas/AppData"
          nullable: true
        orderPda:
          description: The order's on-chain account.
          allOf:
            - $ref: "#/components/schemas/Pubkey"
        creationDate:
          type: string
          format: date-time
        executedSellAmount:
          description: Sell tokens pulled from the order so far.
          allOf:
            - $ref: "#/components/schemas/TokenAmount"
        executedBuyAmount:
          description: Buy tokens paid to the order so far.
          allOf:
            - $ref: "#/components/schemas/TokenAmount"
        status:
          $ref: "#/components/schemas/OrderStatus"
        lastValidBlockHeight:
          description: |
            The block height a pending sponsored creation dies at. Present
            only while the order awaits its on-chain creation: past this
            height the stored transaction can no longer land and a fresh
            signature is needed.
          type: integer
          format: int64
    CompetitionOrderStatus:
      description: |
        Auction progress of an order. `solved`, `executing`, and `traded`
        carry a `value` list of per-solution inclusions, empty until the
        autopilot persists competition results.
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [open, scheduled, active, solved, executing, traded, cancelled, expired]
        value:
          description: |-
            A list of solvers who participated in the latest competition, sorted
            by score in ascending order, where the last element is the winner.

            The presence of executed amounts defines whether the solver provided
            a solution for the desired order.
          type: array
          items:
            $ref: "#/components/schemas/SolutionInclusion"
    SolutionInclusion:
      description: One solution's view of the order.
      type: object
      required:
        - solver
      properties:
        solver:
          description: The on-chain address of the solver.
          allOf:
            - $ref: "#/components/schemas/Pubkey"
        executedAmounts:
          description: |-
            The executed amounts for the order as proposed by the solver,
            omitted when the solution does not include the order.
          type: object
          required:
            - sell
            - buy
          properties:
            sell:
              $ref: "#/components/schemas/TokenAmount"
            buy:
              $ref: "#/components/schemas/TokenAmount"
    Signature:
      description: A base58-encoded Solana transaction signature.
      type: string
      example: "BUguQsv2ZuHus54HAFzjdJHzZBkygAjKhEeYwSG19tUfUyvvz3worsdQCdAXDNjakJHioSiyxhFiDJrm8XpSXRA"
    Trade:
      description: One fill of an order.
      type: object
      required:
        - orderUid
        - owner
        - sellToken
        - buyToken
        - sellAmount
        - buyAmount
        - txSignature
        - instructionIndex
      properties:
        orderUid:
          $ref: "#/components/schemas/OrderUid"
        owner:
          $ref: "#/components/schemas/Pubkey"
        sellToken:
          description: The mint of the token sold.
          allOf:
            - $ref: "#/components/schemas/Pubkey"
        buyToken:
          description: The mint of the token bought.
          allOf:
            - $ref: "#/components/schemas/Pubkey"
        sellAmount:
          description: Sell tokens pulled by this fill.
          allOf:
            - $ref: "#/components/schemas/TokenAmount"
        buyAmount:
          description: Buy tokens paid by this fill.
          allOf:
            - $ref: "#/components/schemas/TokenAmount"
        txSignature:
          description: The settlement transaction.
          allOf:
            - $ref: "#/components/schemas/Signature"
        instructionIndex:
          description: |
            Position of the settlement instruction within its transaction,
            disambiguating multiple fills of one order in the same
            transaction.
          type: integer
          format: int32
        slot:
          description: |
            Slot the settlement landed in. Absent while the settlement row
            has not been indexed.
          type: integer
          format: int64
          nullable: true
    SolverCompetitionResponse:
      description: |
        The solutions every solver proposed for one auction. The `auctionId`
        is the id the solvers were given.
      type: object
      required:
        - auctionId
        - auctionStartSlot
        - auctionDeadlineSlot
        - transactionSignatures
        - referenceScores
        - auction
        - solutions
      properties:
        auctionId:
          type: integer
          format: int64
        auctionStartSlot:
          description: The slot the auction was cut at.
          type: integer
          format: int64
        auctionDeadlineSlot:
          description: The slot by which the winners had to submit their settlements.
          type: integer
          format: int64
        transactionSignatures:
          description: |
            The transactions that settled the auction, attributed to a
            solution.
          type: array
          items:
            $ref: "#/components/schemas/Signature"
        referenceScores:
          description: |
            Per winning solver, keyed by its address: the winners' total
            score with that solver's solutions removed, the rewards baseline
            of [CIP-67](https://forum.cow.fi/t/cip-67-moving-from-batch-auction-to-the-fair-combinatorial-auction/2967).
          type: object
          additionalProperties:
            $ref: "#/components/schemas/TokenAmount"
        auction:
          $ref: "#/components/schemas/CompetitionAuction"
        solutions:
          description: Every proposed solution, worst to best, the winner last.
          type: array
          items:
            $ref: "#/components/schemas/SolverSettlement"
    CompetitionAuction:
      description: The auction the solutions competed on.
      type: object
      required:
        - orders
        - prices
      properties:
        orders:
          description: The orders in the auction.
          type: array
          items:
            $ref: "#/components/schemas/OrderUid"
        prices:
          description: |
            The native price of every mint the auction trades, keyed by mint,
            in lamports per 10^9 base units.
          type: object
          additionalProperties:
            $ref: "#/components/schemas/TokenAmount"
    SolverSettlement:
      description: One proposed solution.
      type: object
      required:
        - solverAddress
        - score
        - ranking
        - orders
        - isWinner
        - filteredOut
      properties:
        solverAddress:
          description: The solver that proposed the solution.
          allOf:
            - $ref: "#/components/schemas/Pubkey"
        score:
          description: The solution's score.
          allOf:
            - $ref: "#/components/schemas/TokenAmount"
        ranking:
          description: |
            The solution's position in the competition, 1 the best. Solutions
            the fairness filter excluded rank after every ranked one.
          type: integer
          format: int64
        referenceScore:
          description: The solver's reference score, winners only.
          allOf:
            - $ref: "#/components/schemas/TokenAmount"
          nullable: true
        txSignature:
          description: |
            The transaction that executed the solution, once the autopilot
            attributes the landed settlement to it.
          allOf:
            - $ref: "#/components/schemas/Signature"
          nullable: true
        orders:
          description: The order executions the solution proposes.
          type: array
          items:
            type: object
            required:
              - id
              - sellAmount
              - buyAmount
              - sellToken
              - buyToken
            properties:
              id:
                $ref: "#/components/schemas/OrderUid"
              sellAmount:
                description: Sell tokens the solution takes from the order.
                allOf:
                  - $ref: "#/components/schemas/TokenAmount"
              buyAmount:
                description: Buy tokens the solution pays the order.
                allOf:
                  - $ref: "#/components/schemas/TokenAmount"
              sellToken:
                description: The mint of the token sold.
                allOf:
                  - $ref: "#/components/schemas/Pubkey"
              buyToken:
                description: The mint of the token bought.
                allOf:
                  - $ref: "#/components/schemas/Pubkey"
        isWinner:
          description: Whether the solution won the right to settle.
          type: boolean
        filteredOut:
          description: |
            Whether the fairness filter of [CIP-67](https://forum.cow.fi/t/cip-67-moving-from-batch-auction-to-the-fair-combinatorial-auction/2967)
            excluded the solution from the ranking.
          type: boolean
    QuoteRequest:
      description: |
        A quote request. Fields with no Solana meaning (`signingScheme`,
        `priceQuality`, `sellTokenBalance`, `buyTokenBalance`) are accepted
        and ignored, so the EVM request body works unchanged.
      type: object
      required:
        - from
        - sellToken
        - buyToken
        - kind
      properties:
        from:
          $ref: "#/components/schemas/Pubkey"
        sellToken:
          $ref: "#/components/schemas/Pubkey"
        buyToken:
          description: The mint to buy, or the System Program ID for native SOL.
          allOf:
            - $ref: "#/components/schemas/Pubkey"
        receiver:
          description: >-
            Optional recipient of the proceeds, in place of `from`. Either a
            wallet, paid into its associated token account for the buy mint (or
            directly, for native SOL), or a token account of the buy mint
            itself. Echoed back untouched.
          allOf:
            - $ref: "#/components/schemas/Pubkey"
        kind:
          $ref: "#/components/schemas/OrderKind"
        sellAmountBeforeFee:
          description: "For `kind: sell`. No component charges a fee, so this equals `sellAmountAfterFee`."
          allOf:
            - $ref: "#/components/schemas/TokenAmount"
        sellAmountAfterFee:
          description: "For `kind: sell`."
          allOf:
            - $ref: "#/components/schemas/TokenAmount"
        buyAmountAfterFee:
          description: "For `kind: buy`."
          allOf:
            - $ref: "#/components/schemas/TokenAmount"
        validTo:
          description: Unix timestamp (`uint32`) the quoted order would expire at.
          type: integer
        validFor:
          description: Seconds from now the quoted order would expire after.
          type: integer
        appData:
          description: |
            The order's app data, the full document or its hash, checked like
            at placement: a hash must have its document registered, the zero
            hash names the empty document. The zero hash when omitted.
          oneOf:
            - $ref: "#/components/schemas/AppData"
            - $ref: "#/components/schemas/AppDataHash"
        appDataHash:
          description: |
            The hash of the `appData` document. If present, `appData` must be
            the document this hash is derived from.
          allOf:
            - $ref: "#/components/schemas/AppDataHash"
          nullable: true
    QuoteResponse:
      type: object
      required:
        - quote
        - from
        - expiration
        - verified
      properties:
        quote:
          $ref: "#/components/schemas/Quote"
        from:
          $ref: "#/components/schemas/Pubkey"
        expiration:
          description: When the quoted amounts stop being honored.
          type: string
          format: date-time
        id:
          description: The stored quote's id. Null when storing the quote failed.
          type: integer
          format: int64
          nullable: true
        verified:
          description: >-
            Whether the amounts were confirmed by simulating the quoted
            settlement behind the creation of the quoted order, its sell
            tokens conjured. False when the deployment does not verify,
            nothing funds the sell in simulation, or the simulation did not
            confirm them.
          type: boolean
        funder:
          description: >-
            The account a sponsored creation transaction must name as its fee
            payer and as the `created_by` rent payer of `CreateOrder`. Null
            when the deployment does not sponsor placements, in which case
            `POST /api/v1/orders` refuses a creation transaction.
          allOf:
            - $ref: "#/components/schemas/Pubkey"
          nullable: true
    Quote:
      description: The quoted order.
      type: object
      required:
        - sellToken
        - buyToken
        - sellAmount
        - buyAmount
        - validTo
        - appData
        - feeAmount
        - costs
        - kind
        - partiallyFillable
      properties:
        sellToken:
          $ref: "#/components/schemas/Pubkey"
        buyToken:
          $ref: "#/components/schemas/Pubkey"
        receiver:
          allOf:
            - $ref: "#/components/schemas/Pubkey"
          nullable: true
        sellAmount:
          $ref: "#/components/schemas/TokenAmount"
        buyAmount:
          $ref: "#/components/schemas/TokenAmount"
        validTo:
          description: Unix timestamp (`uint32`) the quoted order expires at.
          type: integer
        appData:
          description: |
            The request's `appData`, the full document or its hash, the zero
            hash when the request named none.
          oneOf:
            - $ref: "#/components/schemas/AppData"
            - $ref: "#/components/schemas/AppDataHash"
        appDataHash:
          description: The hash of `appData`, present when it is a document.
          allOf:
            - $ref: "#/components/schemas/AppDataHash"
        feeAmount:
          description: Always zero. No component charges a fee.
          allOf:
            - $ref: "#/components/schemas/TokenAmount"
        costs:
          $ref: "#/components/schemas/Costs"
        kind:
          $ref: "#/components/schemas/OrderKind"
        partiallyFillable:
          type: boolean
    Costs:
      description: >-
        The execution cost taken out of the quoted amounts, in the token it
        comes out of: a sell order's `buyAmount` is lower by `total`, a buy
        order's `sellAmount` higher. Each cost converts from lamports at the
        autopilot's native price on its own, rounded up against the trader.
        Drivers are ranked on the amounts after the cut.
      type: object
      required:
        - token
        - networkFees
        - buyTokenAtaCosts
        - protocolFee
        - total
      properties:
        token:
          description: >-
            The buy token of a sell order, the sell token of a buy order.
          allOf:
            - $ref: "#/components/schemas/Pubkey"
        networkFees:
          description: >-
            The network fee of settling the quoted route, as the winning
            driver reported it. Zero when the driver reports none.
          allOf:
            - $ref: "#/components/schemas/TokenAmount"
        buyTokenAtaCosts:
          description: >-
            Rent, at the cluster's rent, of the buy token account when the
            settlement must create it. Zero when the payout lands in an
            existing one and for native SOL buys. An anonymous quote, `from`
            zero without a `receiver`, names no account to read and is priced
            as if it were missing. An upper bound when the account cannot be
            read, without sponsoring included.
          allOf:
            - $ref: "#/components/schemas/TokenAmount"
        protocolFee:
          description: Always zero. No component charges a fee.
          allOf:
            - $ref: "#/components/schemas/TokenAmount"
        total:
          description: The sum of the costs above.
          allOf:
            - $ref: "#/components/schemas/TokenAmount"
    Error:
      description: A machine-readable error type and a human-readable description.
      type: object
      required:
        - errorType
        - description
      properties:
        errorType:
          type: string
          example: "NotFound"
        description:
          type: string
