# Example configuration for the Solana driver.

[chain]
# Placeholder — replace with the CoW Settlement program id.
settlement-program-id = "MooohhPEAAHwAwEozL7JPEmnDvaahuUpccYN4Yb8ccK"
# The solver identity settlements are signed with.
solver-keypair = "~/.config/solana/id.json"

[rpc]
endpoint = "https://api.mainnet-beta.solana.com"
request-timeout = "10s"

[http]
bind-address = "0.0.0.0:8080"

[logging]
filter = "info,solana_driver=debug"
# stderr-threshold = "warn"
# use-json = false

[[solvers]]
name = "baseline"
endpoint = "http://localhost:8001"
account = "9VXC6LH9eXMBpXLQnxMYAGkjs59Zon2ACciJwQ6iMzNB"
max-in-flight = 1
