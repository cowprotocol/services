# Example configuration for the Solana driver.

[chain]
# The CoW Settlement program id (v0.2.0, stable mainnet address).
settlement-program-id = "J516Mv7YvvvJyMvNEca8tWNTJyDHbFpzwDZD96BNfR3w"

[rpc]
endpoint = "https://api.mainnet-beta.solana.com"
request-timeout = "10s"

[http]
bind-address = "0.0.0.0:8080"

[logging]
filter = "info,solana_driver=debug"
# stderr-threshold = "warn"
# use-json = false

[settlement]
# Push reductions, in basis points of the promised buy amount, to fall back to
# when a solver's swap delivers less than promised. Omit to disable.
# push-reduction-bps = [1, 2, 4, 8, 16, 32, 64]

[[solvers]]
name = "baseline"
endpoint = "http://localhost:8001"
# Path to the solver's settlement signer keypair. The driver's on-chain
# identity for this solver is derived from this keypair.
# TODO: plaintext keypair paths are temporary; KMS is planned.
signer-keypair = "/path/to/keypair.json"
# Temporary staging knob: solve only auctions whose id is a multiple of this
# value, sitting the rest out so other solvers win settlements to test
# against. Omit to participate in every auction.
# solve-every-nth-auction = 5
