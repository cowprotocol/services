# Example configuration for the Solana driver.

[chain]
# The CoW Settlement program id (v0.2.0, stable mainnet address).
settlement-program-id = "J516Mv7YvvvJyMvNEca8tWNTJyDHbFpzwDZD96BNfR3w"

[rpc]
endpoint = "https://api.mainnet-beta.solana.com"
# Serves only `simulateBundle`; must support that Jito extension.
# TODO: temporary split; a single endpoint will serve every method soon and
# this key goes away.
bundle-endpoint = "https://bundles.example.com"
request-timeout = "10s"

[priority-fee]
# Optional; the values below are the defaults.
# The percentile of the fees recently paid over a transaction's writable
# accounts to use as the compute unit price, 0..=100, ranging over the most
# recent `recent-slots` slots, 1..=150.
percentile = 75
recent-slots = 50
# The lowest compute unit price, in micro-lamports per compute unit.
min-compute-unit-price = 10000
# The most a transaction pays in priority fee (price times compute unit
# limit), in lamports. A transaction over it is refused as over budget.
max-priority-fee-lamports = 1000000

[http]
bind-address = "0.0.0.0:8080"

[logging]
filter = "info,solana_driver=debug"
# stderr-threshold = "warn"
# use-json = false

[[solvers]]
name = "baseline"
endpoint = "http://localhost:8001"
# The solver's settlement signer: a keypair file, or the id, alias, or ARN
# of an AWS KMS Ed25519 key so the private key never reaches the driver.
signer = { keypair = "/path/to/keypair.json" }
# signer = { kms-key = "arn:aws:kms:eu-central-1:123456789012:key/11111111-2222-3333-4444-555555555555" }
# Temporary staging knob: solve only auctions whose id is a multiple of this
# value, sitting the rest out so other solvers win settlements to test
# against. Omit to participate in every auction.
# solve-every-nth-auction = 5
# Who prices the execution costs, the network fee and the rent of the buy
# token accounts the settlement creates, into the fills: "driver" cuts them
# from every fill the engine reports, "solver" leaves them to the engine.
# Omit for the driver.
# fee-handler = "driver"
# The share of every fill, in basis points 0..10000, the driver takes on top
# of the execution costs when it prices them: the engine reports the leg its
# route quotes, and a route delivering less leaves the buffer short of the
# push, reverting the settlement. Quotes shrink by it too. Omit for none.
# solver-fee-bps = 10
# The largest share of a settlement's native SOL payouts, in basis points
# 0..10000, that the solver's own SOL covers when the swap delivers less SOL
# than the payouts. A larger shortfall reverts the settlement. Omit to revert
# on any shortfall.
# max-native-shortfall-bps = 40
