[package]
name = "solana-driver"
version = "0.1.0"
authors = ["Cow Protocol Developers <dev@cow.fi>"]
edition = "2024"
license = "GPL-3.0-or-later"
description = "Solana settlement driver for CoW Protocol"
repository = "https://github.com/cowprotocol/services"

[lib]
name = "solana_driver"
path = "src/lib.rs"

[[bin]]
name = "solana-driver"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
configs = { workspace = true }
humantime-serde = { workspace = true }
observe = { workspace = true }
serde = { workspace = true }
serde-ext = { workspace = true }
solana-sdk = { workspace = true }
tikv-jemallocator = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true, features = ["serde"] }

[features]
default = []

[lints]
workspace = true
