[package]
name = "autopilot-svm"
version = "0.1.0"
edition = "2024"
description = "Solana autopilot: the chain-generic auction loop and its seam traits"

[lib]
name = "autopilot_svm"
path = "src/lib.rs"

[[bin]]
name = "autopilot-svm"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bigdecimal = { workspace = true }
chain-types = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true }
configs = { workspace = true }
const-hex = { workspace = true }
cow-solana-rpc = { workspace = true }
database = { workspace = true }
futures = { workspace = true }
humantime-serde = { workspace = true }
observe = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde-ext = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
solana-sdk = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tikv-jemallocator = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
winner-selection = { workspace = true }

[dev-dependencies]

[lints]
workspace = true
