# Example configuration for the Solana autopilot.

# Serves /metrics, /liveness, /ready, and /startup.
metrics-port = 9586
# The pod fails the liveness probe when no auction cycle completed in this
# time.
max-auction-age = "5m"
# Minimum time between auction cycles. Zero runs a cycle every new slot.
min-auction-interval = "2s"
# Slots the indexer may lag behind the tip before auction cuts are skipped.
max-indexer-lag-slots = 150

[database]
# The Postgres database the indexer writes to. A value like "%DB_WRITE_URL"
# reads the URL from that environment variable.
write-url = "postgresql://"

[rpc]
# The devnet node.
endpoint = "https://api.devnet.solana.com"
request-timeout = "10s"

[contracts]
wrapped-native-mint = "So11111111111111111111111111111111111111112"

[competition]
max-winners = 1
solve-deadline = "6s"
submission-deadline-slots = 25

[[drivers]]
name = "baseline"
url = "http://localhost:11088"

# Native price lookups for auction tokens. Sources are asked in order: a
# token the first one does not price is asked from the next.
[native-prices]
ttl = "30s"
# Lamports a driver source buys per probe quote, a tenth of a SOL.
driver-probe-lamports = 100000000

# The CoinGecko key is optional: without one the public API and its rate
# limits apply. A value like "%COIN_GECKO_API_KEY" reads the key from that
# environment variable.
[[native-prices.estimators]]
type = "coin-gecko"
endpoint = "https://api.coingecko.com/api/v3/simple/token_price"
# api-key = "%COIN_GECKO_API_KEY"

# A solver driver quoted through its regular /quote route. The url includes
# the solver path, like the [[drivers]] entries. The driver's solver must
# answer buy orders, the probe buys a fixed amount of wSOL.
[[native-prices.estimators]]
type = "driver"
name = "baseline"
url = "http://localhost:11088/baseline/"

[logging]
filter = "info,autopilot_svm=debug"

# Sponsored order execution. Must be set when the orderbook accepts
# sponsored orders: without it their winning solutions fail at the driver.
# [sponsoring]
# funder-keypair = "/path/to/funder-keypair.json"
