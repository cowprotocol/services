name: pull request
on:
  merge_group: {}
  pull_request:
  # We require PRs to be up to date before merging so technically it is not needed run the rust job
  # on main. However for the cache to be usable in PRs we do need the job on main.
  push:
    branches: [main]
jobs:
  lint:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: ./.github/actions/setup-rust-cache
        with:
          shared-key: lint
      - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
        with:
          profile: minimal
          toolchain: nightly
          components: rustfmt
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.39.0
      - uses: tombi-toml/setup-tombi@f2ae7247d62521245eb2793d653b9df472b9e090 # v1.2.4
        with:
          version: "1.1.0"
      - run: |
          rustup --version
          rustup show
          cargo --version
          cargo +nightly fmt --version
          cargo clippy --version
          tombi --version
      - run: just fmt --check
      - run: just clippy
      - run: just fmt-toml --check

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2.82.9
        with:
          tool: cargo-audit
      - run: cargo audit

  nitpicker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ethanis/nitpicker@e891622bbd9a6ec97a473bcfacfca7332caf2862 # v1.7
        with:
          nitpicks: ".github/nitpicks.yml"
          token: "${{ secrets.GITHUB_TOKEN }}"

  doc-tests:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.doc != 'false' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.39.0
      - run: rustup toolchain install stable --profile minimal
      - uses: ./.github/actions/setup-rust-cache
        with:
          shared-key: checks
      - run: just test-doc

  unit-tests:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.unit != 'false' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # Shrink artifact size by not including debug info. Makes build faster and shrinks cache.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: ./.github/actions/setup-rust-cache
        with:
          shared-key: tests
      - uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2.82.9
        with:
          tool: nextest
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.39.0
      - run: cargo build --locked --tests
      # Run only the tests of the packages that the changes can affect. Some of
      # these packages can have no tests.
      - run: just test-unit ${FILTER:+-E "$FILTER" --no-tests=warn}
        env:
          FILTER: ${{ needs.changes.outputs.nextest-filter }}

  test-db:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.db != 'false' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # Shrink artifact size by not including debug info. Makes build faster and shrinks cache.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: ./.github/actions/setup-rust-cache
        with:
          shared-key: tests
      # Start the build process in the background. The following cargo test command will automatically
      # wait for the build process to be done before proceeding.
      - run: cargo build --locked -p orderbook -p database -p autopilot -p solana-indexer -p solana-orderbook --tests &
      - uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2.82.9
        with:
          tool: nextest
      - run: docker compose -f docker-compose.yaml up -d db
      - run: docker compose -f docker-compose.yaml up migrations --abort-on-container-failure
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.39.0
      # Run only the tests of the packages that the changes can affect.
      - run: just test-db ${FILTER:+-E "$FILTER"}
        env:
          FILTER: ${{ needs.changes.outputs.nextest-filter }}

  # Runs against a database holding only the solana.* series, so a schema
  # accidentally depending on the base series fails here.
  test-db-solana:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.db-solana != 'false' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # Shrink artifact size by not including debug info. Makes build faster and shrinks cache.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: ./.github/actions/setup-rust-cache
        with:
          shared-key: tests
      # Start the build process in the background. The following cargo test command will automatically
      # wait for the build process to be done before proceeding.
      - run: cargo build --locked -p solana-indexer -p autopilot-svm --tests &
      - uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2.82.9
        with:
          tool: nextest
      - run: docker compose -f docker-compose.yaml up -d db
      - run: docker compose -f docker-compose.yaml up migrations-solana --abort-on-container-failure
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.39.0
      # Run only the tests of the packages that the changes can affect.
      - run: just test-db-solana ${FILTER:+-E "$FILTER"}
        env:
          FILTER: ${{ needs.changes.outputs.nextest-filter }}

  # Finds the jobs and the tests that the changes of a PR can affect. A job
  # skips only when its output is `false`.
  changes:
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ fromJSON(steps.select.outputs.groups || '{}').unit }}
      e2e: ${{ fromJSON(steps.select.outputs.groups || '{}').e2e }}
      driver: ${{ fromJSON(steps.select.outputs.groups || '{}').driver }}
      db: ${{ fromJSON(steps.select.outputs.groups || '{}').db }}
      db-solana: ${{ fromJSON(steps.select.outputs.groups || '{}').db-solana }}
      doc: ${{ fromJSON(steps.select.outputs.groups || '{}').doc }}
      nextest-filter: ${{ steps.select.outputs.nextest-filter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The PR merge commit and its parents. The first parent is the base branch.
          fetch-depth: 2
      - run: rustup toolchain install stable --profile minimal
      - id: select
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/select-tests
        with:
          base: HEAD^1
          # `db` and `db-solana` are the packages that have tests with
          # `postgres` and `solana_db` in their names. `doc` has the packages
          # that have doc tests.
          groups: |
            unit=*
            e2e=e2e
            driver=driver
            db=autopilot database orderbook
            db-solana=autopilot-svm solana-indexer solana-orderbook
            doc=autopilot driver number testlib
          # Only the `migrations-solana` service of docker-compose.yaml uses
          # database/sql-solana/.
          ignore: |
            docs/
            database/sql-solana/

  # Sharded with nextest partitions, one runner per shard. The gate jobs
  # carry the names the branch ruleset requires.
  test-local-node-shard:
    name: test-local-node (${{ matrix.shard }}/4)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.e2e != 'false' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Shrink artifact size by not including debug info. Makes build faster and shrinks cache.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: always
      TOML_TRACE_ERROR: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          # anvil 1.8.0 changed trace/call semantics that the e2e and driver tests rely on
          version: v1.7.1
      - uses: ./.github/actions/setup-rust-cache
        with:
          shared-key: tests
      # Start the build process in the background. The following cargo test command will automatically
      # wait for the build process to be done before proceeding.
      - run: cargo build --locked -p e2e --tests &
      - uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2.82.9
        with:
          tool: nextest
      - run: docker compose -f docker-compose.yaml up -d db
      - run: docker compose -f docker-compose.yaml up migrations --abort-on-container-failure
      - run: docker compose -f docker-compose.yaml up migrations-pool-indexer --abort-on-container-failure
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.39.0
      - run: just test-e2e-local --partition count:${{ matrix.shard }}/4

  test-local-node:
    needs: [changes, test-local-node-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          result="${{ needs.test-local-node-shard.result }}"
          # The shards skip only when no change affects the e2e tests.
          if [ "$result" = skipped ] && [ "${{ needs.changes.result }}" = success ] &&
            [ "${{ needs.changes.outputs.e2e }}" = false ]; then
            exit 0
          fi
          test "$result" = success

  test-forked-node:
    name: test-forked-node (${{ matrix.shard }}/2)
    needs: changes
    # Do not run this job on forks since some secrets are required for it.
    # Also skip it when no change affects the e2e tests.
    if: |
      !cancelled() && needs.changes.outputs.e2e != 'false' && (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
        github.event_name == 'merge_group' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      # Shrink artifact size by not including debug info. Makes build faster and shrinks cache.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: always
      FORK_URL_MAINNET: ${{ secrets.FORK_URL_MAINNET }}
      FORK_URL_GNOSIS: ${{ secrets.FORK_URL_GNOSIS }}
      TOML_TRACE_ERROR: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          # the latest version introduced a bug caused forked node tests to fail
          # only switch back to latest stable version after it was fixed in anvil
          version: v1.0.0
      - uses: ./.github/actions/setup-rust-cache
        with:
          shared-key: tests
      # Start the build process in the background. The following cargo test command will automatically
      # wait for the build process to be done before proceeding.
      - run: cargo build --locked -p e2e --tests &
      - uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2.82.9
        with:
          tool: nextest
      - run: docker compose -f docker-compose.yaml up -d db
      - run: docker compose -f docker-compose.yaml up migrations --abort-on-container-failure
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.39.0
      - run: just test-e2e-forked --partition count:${{ matrix.shard }}/2

  test-driver:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.driver != 'false' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # Shrink artifact size by not including debug info. Makes build faster and shrinks cache.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: always
      TOML_TRACE_ERROR: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          # anvil 1.8.0 changed trace/call semantics that the e2e and driver tests rely on
          version: v1.7.1
      - uses: ./.github/actions/setup-rust-cache
        with:
          shared-key: tests
      - uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2.82.9
        with:
          tool: nextest
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.39.0
      # Build the driver's tests.
      - run: cargo build --locked -p driver --tests
      # Don't spawn any docker containers. The driver's tests will spawn anvil itself.
      - run: just test-driver

  solidity-artifacts:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Solidity artifacts
        working-directory: contracts/solidity
        run: make -B artifacts
      - name: Verify no JSON changes
        run: |
          if git diff --exit-code -- 'contracts/artifacts/*.json'; then
            echo "✓ Solidity artifacts are up-to-date"
          else
            echo "✗ Solidity artifacts are out-of-date. Please run 'cd contracts/solidity && make -B artifacts' and commit the changes."
            # run the command again to show exactly what the changes would be
            git diff --exit-code -- 'contracts/artifacts/*.json'
            exit 1
          fi

  openapi:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm install @apidevtools/swagger-cli @stoplight/spectral-cli
      - run: node_modules/.bin/swagger-cli validate crates/orderbook/openapi.yml
      - run: node_modules/.bin/swagger-cli validate crates/driver/openapi.yml
      - run: node_modules/.bin/swagger-cli validate crates/solvers/openapi.yml
      - run: node_modules/.bin/swagger-cli validate crates/solana-orderbook/openapi.yml
      - run: node_modules/.bin/spectral lint crates/orderbook/openapi.yml
      - run: node_modules/.bin/spectral lint crates/driver/openapi.yml
      - run: node_modules/.bin/spectral lint crates/solvers/openapi.yml
      - run: node_modules/.bin/spectral lint crates/solana-orderbook/openapi.yml

  run-flaky-test:
    # to debug a flaky test set `if` to true and configure the flaky test in the `run` step
    if: ${{ false }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # Shrink artifact size by not including debug info. Makes build faster and shrinks cache.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: always
      TOML_TRACE_ERROR: 1
      FORK_URL_MAINNET: ${{ secrets.FORK_URL_MAINNET }}
      FORK_URL_GNOSIS: ${{ secrets.FORK_URL_GNOSIS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          # anvil 1.8.0 changed trace/call semantics that the e2e and driver tests rely on
          version: v1.7.1
      - uses: ./.github/actions/setup-rust-cache
        with:
          shared-key: tests
      # Start the build process in the background. The following cargo test command will automatically
      # wait for the build process to be done before proceeding.
      - run: cargo build --locked -p e2e --tests &
      - uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2.82.9
        with:
          tool: nextest
      - run: docker compose -f docker-compose.yaml up -d db
      - run: docker compose -f docker-compose.yaml up migrations --abort-on-container-failure
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.39.0
      - name: Run test in a loop
        run: |
          attempt=1
          while true; do
            echo "Running test attempt #$attempt"
            if ! just test-e2e forked_node_mainnet_repay_debt_with_collateral_of_safe; then
              exit 1
            fi
            attempt=$((attempt+1))
          done

  generated-contracts:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - uses: ./.github/actions/setup-rust-cache
        with:
          shared-key: generated-contracts
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.39.0
      - uses: tombi-toml/setup-tombi@f2ae7247d62521245eb2793d653b9df472b9e090 # v1.2.4
        with:
          version: "1.1.0"
      - name: Verify the code hasn't been tampered with by generating contracts again and making sure there has been no changes
        run: |
          just generate-contracts
          if git diff --exit-code; then
            echo "✓ Generated contracts are up-to-date"
          else
            echo "✗ Generated contracts are out-of-date or were modified by hand. Please run 'just generate-contracts' and commit the changes."
            exit 1
          fi

  event-bus-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          # On non-PR events (push to main, merge queue) always run the check.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=1 origin "$base"
          if git diff --name-only "$base" "${{ github.sha }}" | grep -q '^crates/event-bus-dto/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  event-bus-schemas:
    needs: event-bus-changes
    if: needs.event-bus-changes.outputs.changed == 'true'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: ./.github/actions/setup-rust-cache
        with:
          shared-key: checks
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.39.0
      - name: Verify the generated event bus schemas are up-to-date
        run: |
          just generate-event-schemas
          if git diff --exit-code -- 'crates/event-bus-dto/schemas/*.json'; then
            echo "✓ Event bus schemas are up-to-date"
          else
            echo "✗ Event bus schemas are out-of-date. Please run 'just generate-event-schemas' and commit the changes."
            # run the command again to show exactly what the changes would be
            git diff --exit-code -- 'crates/event-bus-dto/schemas/*.json'
            exit 1
          fi
