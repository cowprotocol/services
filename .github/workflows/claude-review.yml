name: Claude PR Review
on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  authorize:
    # Payload-only pre-filter: no API call for bots / drafts / skip-label.
    # Bots excluded HERE (not via the permission check) so they're skipped
    # even if a bot account is ever granted write access.
    if: >
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.type != 'Bot' &&
        !contains(github.event.pull_request.labels.*.name, 'skip-claude-review')
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.comment.user.type != 'Bot' &&
        contains(github.event.comment.body, '@claude')
      )
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:   ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login || github.event.comment.user.login }}
        run: |
          allowed=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" \
                      --jq '.user.permissions.push' 2>/dev/null || echo false)
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
  review:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history lets the action compute an accurate diff vs the base
          # branch instead of just the latest commit.
          fetch-depth: 0

      - id: claude
        uses: anthropics/claude-code-action@459ad358ae43fea66bfefd0a1f8d840b4b9791fb # v1.0.194
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          track_progress: true
          # Reviewing a diff means opening the files around it, and a denied
          # tool call still consumes a turn, so an allowlist without the read
          # tools burns the turn budget instead of reviewing.
          claude_args: |
            --model claude-opus-4-8
            --max-turns 50
            --allowedTools "Read,Grep,Glob,LS,mcp__github_inline_comment__create_inline_comment"
          prompt: |
            Review this PR. Post each issue as an INLINE comment on the exact file and
            line using the create_inline_comment tool. Follow the pr-review skill if available.

      # The action exits 0 even when the model/API errors ("is_error": true in
      # the execution file), so CI goes green and no review is posted. Re-surface
      # that as a failed step + PR comment. (Upstream has no fail_on_error input.)
      - name: Fail if Claude errored
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          result=$(jq -c 'map(select(.type == "result")) | last // {}' "$EXEC_FILE" 2>/dev/null || echo '{}')
          is_error=$(printf '%s' "$result" | jq -r '.is_error // false')
          subtype=$(printf '%s' "$result" | jq -r '.subtype // "unknown"')
          if [ "$CLAUDE_OUTCOME" != "failure" ] && [ "$is_error" != "true" ]; then
            echo "Claude review completed without error."
            exit 0
          fi
          # A turn budget that ran out and an API failure need different fixes,
          # so the comment names which one happened.
          if [ "$subtype" = "error_max_turns" ]; then
            turns=$(printf '%s' "$result" | jq -r '.num_turns // "?"')
            denials=$(printf '%s' "$result" | jq -r '.permission_denials_count // 0')
            reason="it ran out of turns ($turns used, $denials tool calls denied). Raise \`--max-turns\`, or allow the denied tools so the budget goes to reviewing."
          else
            reason="the step failed with subtype \`$subtype\`, usually an Anthropic API, auth or credit error. Check [Claude status](https://status.claude.com/)."
          fi
          msg="⚠️ **Claude PR review failed to run**: $reason See the [workflow run]($RUN_URL) for details."
          echo "::error::Claude PR review failed ($subtype), see $RUN_URL"
          gh pr comment "$PR_NUMBER" --body "$msg" || echo "Could not post PR comment"
          exit 1
