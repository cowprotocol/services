name: deploy
on:
  push:
    branches: [main]
    tags: [v*]
  workflow_dispatch:
    inputs:
      predefined_feature:
        description: 'Select a predefined feature'
        type: choice
        options:
          - 'None'
          - 'tokio-console'
        default: 'None'
        required: false
      custom_features:
        description: 'Additional custom features (space-separated, e.g., "feature1 feature2")'
        type: string
        required: false
        default: ''

# A job with no permissions of its own uses these, not the repository default.
permissions:
  contents: read
  packages: write

jobs:
  # This job builds one services image for each architecture. The `publish` job
  # then combines the digests into one multi-platform manifest.
  # The runner compiles the release binaries. Then the build copies them into
  # the image. A build for a different architecture needs emulation, and
  # emulation makes the Rust build much slower.
  build:
    name: build ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    # each build runner must have a glibc version <= the docker base image we copy the build
    # artifacts onto to be compatible
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Without this the fetch depth defaults to 1, which only includes the most recent commit. We want to know the full history so that `git describe` can give more information when it is invoked in the orderbook's crate build script.
          fetch-depth: '0'
          persist-credentials: false

      # the checkout action sets the "modified" time of every file to the current time which
      # makes `cargo` think something changed about the file. To help it detect what actually
      # changed compared to the cached build artifacts we set the "modified" time of every
      # file to the timestamp of the commit that last changed it.
      - uses: chetan/git-restore-mtime-action@d186aca54f8760da4dec55313195e51ed3ebb0b3 # v2.3

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Prepare build features
        id: features
        run: |
          FEATURES=""

          if [ "${{ github.event.inputs.predefined_feature }}" != "None" ]; then
            FEATURES="${{ github.event.inputs.predefined_feature }}"
          fi

          if [ -n "${{ github.event.inputs.custom_features }}" ]; then
            FEATURES="${FEATURES:+$FEATURES }${{ github.event.inputs.custom_features }}"
          fi

          if [ -n "$FEATURES" ]; then
            CARGO_FEATURES="--features $FEATURES"
          fi

          if echo "$FEATURES" | grep -q "tokio-console"; then
            # Export to GITHUB_ENV so rust-cache picks it up in its cache-key hash
            # (it hashes all RUST* env vars). Without this, tokio-console and normal
            # builds share the same cache bucket despite having incompatible artifacts.
            echo "RUSTFLAGS=--cfg tokio_unstable" >> $GITHUB_ENV
          fi

          echo "cargo_features=$CARGO_FEATURES" >> $GITHUB_OUTPUT

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-all-crates: true
          cache-workspace-crates: true
          # A constant key, so tag builds read the cache that main writes
          shared-key: deploy
          # Only write to the cache if running on main
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release binaries
        run: |
          cargo build --release \
            -p autopilot -p driver -p orderbook -p refunder -p solvers -p pool-indexer \
            -p solana-indexer -p solana-orderbook -p solana-driver -p solana-solvers \
            -p autopilot-svm \
            ${{ steps.features.outputs.cargo_features }}

      # Proposed public CI action. Replace @v1 with its reviewed commit SHA
      # after cowprotocol/ci is published; this draft demonstrates the interface.
      - name: Package services image and export digest
        uses: cowprotocol/ci/actions/build-image@v1
        with:
          image: ghcr.io/${{ github.repository }}
          platform: linux/${{ matrix.arch }}
          context: .
          file: Dockerfile.deploy-ci
          build-contexts: binaries=target/release
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-or-later
          digest-artifact-name: services-digest-${{ matrix.arch }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  # Combine the native builds only when both succeeded. The shared workflow
  # downloads this run's digest artifacts and applies tags to the image index.
  publish:
    needs: build
    uses: cowprotocol/ci/.github/workflows/publish-image.yml@v1
    with:
      image: ghcr.io/${{ github.repository }}
      digest-artifact-pattern: services-digest-*
      tags: |
        type=sha
        type=ref,event=branch
        type=ref,event=tag
      labels: |
        org.opencontainers.image.licenses=GPL-3.0-or-later

  # The migration image is self-contained, so it can use the complete shared
  # build workflow. Preserve the existing services -> migrations publish order.
  migrations:
    needs: publish
    uses: cowprotocol/ci/.github/workflows/build-image.yml@v1
    with:
      image: ghcr.io/${{ github.repository }}-migration
      context: .
      file: Dockerfile.deploy-ci
      target: migrations
      artifact-prefix: services-migration
      tags: |
        type=sha
        type=ref,event=branch
        type=ref,event=tag
      labels: |
        org.opencontainers.image.licenses=GPL-3.0-or-later

  autodeploy:
    runs-on: ubuntu-latest
    needs: migrations
    if: ${{ github.ref == 'refs/heads/main' }}
    # The action only calls an external service.
    permissions: {}

    steps:
      - uses: cowprotocol/autodeploy-action@73f1163f19a584cdc34e29aa84d630d7e6a45432 # v3
        with:
          images: ghcr.io/cowprotocol/services:main
          strategy: restart # Recreates the deployment
          tag: ${{ secrets.AUTODEPLOY_TAG }}
          url: ${{ secrets.AUTODEPLOY_URL }}
          token: ${{ secrets.AUTODEPLOY_TOKEN }}
          timeout: 600000 # 10 minutes

      # Temporarily disabled while the automated-trades deploy setup is reworked
      # (cowprotocol/automated-trade#36). Re-enable once the new job is in place.
      # After the new version is rolled out to the k8s cluster, ask the
      # infrastructure repo to run an automated test trade on every network
      # to verify the deployment end-to-end.
      # - name: "📣 Dispatch automated trades to infrastructure repo"
      #   uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
      #   with:
      #     token: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
      #     repository: cowprotocol/infrastructure
      #     event-type: run-automated-trades
      #     client-payload: |-
      #       {"ref":"${{ github.ref }}","sha":"${{ github.sha }}","source":"services-deploy"}
