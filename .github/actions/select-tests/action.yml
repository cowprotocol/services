name: Select tests
description: >-
  Selects the tests that the changes between a base revision and HEAD can
  affect, from the dependencies between the packages of a Cargo workspace.
  The affected packages are the packages with a changed file, and all the
  workspace packages that depend on them. All the dependency kinds count,
  also dev-dependencies and optional dependencies. A changed `Cargo.lock`
  entry affects the workspace packages that depend on its crate. Another
  changed file in no workspace package affects all the packages, unless a
  path rule or an ignored prefix matches it. The action needs cargo, jq,
  python3 and a checkout that contains the base revision.
inputs:
  base:
    description: The revision to compare with HEAD.
    required: true
  groups:
    description: >-
      One `<group>=<packages>` line for each test group. `<packages>` is a
      list of the workspace packages that the group tests, with a space
      between the names. `*` is all the workspace packages. A group is
      selected when one of its packages is affected.
    required: false
    default: ""
  paths:
    description: >-
      One `<prefix>=<packages>` line for each path rule. A changed file that
      starts with `<prefix>` affects the tests of the listed workspace
      packages, but not the packages that depend on them. Use a rule for files
      that tests read when they run, for example database migrations, not for
      files that a package compiles. `<packages>` has the same form as in
      `groups`. When more than one rule matches a file, the longest prefix
      wins. A rule also wins over the package directory of the file.
    required: false
    default: ""
  ignore:
    description: >-
      One path prefix on each line. A changed file with one of these prefixes
      affects no packages. It is the same as a path rule with no packages.
    required: false
    default: ""
outputs:
  groups:
    description: >-
      A JSON object with "true" or "false" for each group, for example
      {"driver":"false","e2e":"true"}. A group is "false" only when no changed
      file can affect it.
    value: ${{ steps.select.outputs.groups }}
  nextest-filter:
    description: >-
      A nextest filterset that selects the tests of the affected packages:
      `all()`, `none()` or `package(=<name>) | ...`.
    value: ${{ steps.select.outputs.nextest-filter }}
runs:
  using: composite
  steps:
    - name: List the changed files
      id: changed-files
      shell: bash
      env:
        BASE: ${{ inputs.base }}
      run: |
        # A moved file gives its old path and its new path.
        files=$(git diff --no-renames --name-only "$BASE" HEAD | jq -Rnc '[inputs]')
        jq -r '.[]' <<< "$files"
        echo "files=$files" >> "$GITHUB_OUTPUT"

    - name: Find the workspace packages
      id: workspace
      shell: bash
      run: |
        # The name of each workspace package, its directory relative to the
        # workspace root with a `/` at the end, and the workspace packages that
        # it depends on. A dependency with a `path` is a workspace package.
        packages=$(cargo metadata --no-deps --offline --format-version 1 | jq -c '
          .workspace_root as $root
          | .packages
          | map({
              name,
              dir: (.manifest_path | ltrimstr("\($root)/") | rtrimstr("Cargo.toml")),
              deps: [.dependencies[] | select(.path) | .name]
            })')
        jq -r '"\(length) workspace packages"' <<< "$packages"
        echo "packages=$packages" >> "$GITHUB_OUTPUT"

    - name: Read the groups and the path rules
      id: rules
      shell: bash
      env:
        PACKAGES: ${{ steps.workspace.outputs.packages }}
        GROUP_LINES: ${{ inputs.groups }}
        PATH_LINES: ${{ inputs.paths }}
        IGNORE: ${{ inputs.ignore }}
      run: |
        rules=$(jq -nc --argjson packages "$PACKAGES" --arg group_lines "$GROUP_LINES" \
            --arg path_lines "$PATH_LINES" --arg ignore "$IGNORE" '
          # Reads `<key>=<packages>` lines into a map from each key to its
          # packages. `$names` is the names of all the workspace packages.
          def package_lines($names):
            split("\n") | map(select(. != "")
              | capture("^(?<key>[^=]+)=(?<value>[^=]*)$") // error("Not a <name>=<packages> line: \(.)")
              | .value |= [scan("\\S+") | if . == "*" then $names[] else . end]
              | if .value == [] then error("No packages for \(.key)") end
              | if (.value - $names) != [] then error("Not workspace packages: \(.value - $names | join(" "))") end)
            | from_entries;
          [$packages[].name] as $names
          | {
              groups: ($group_lines | package_lines($names)),
              paths: (($path_lines | package_lines($names))
                + ($ignore | split("\n") | map(select(. != "") | {key: ., value: []}) | from_entries))
            }')
        jq -r '.paths | to_entries[] | "\(.key): \(if .value == [] then "ignored" else .value | join(" ") end)"' <<< "$rules"

        groups=$(jq -c .groups <<< "$rules")
        paths=$(jq -c .paths <<< "$rules")
        echo "groups=$groups" >> "$GITHUB_OUTPUT"
        echo "paths=$paths" >> "$GITHUB_OUTPUT"

    - name: Find the packages that the Cargo.lock changes affect
      id: lock
      shell: bash
      env:
        BASE: ${{ inputs.base }}
      run: |
        # The [[package]] entries of a Cargo.lock as a JSON array.
        entries() {
          python3 -c 'import json, sys, tomllib; json.dump(tomllib.load(sys.stdin.buffer)["package"], sys.stdout)'
        }
        # The workspace packages whose entry changed or that depend, directly
        # or not, on a crate whose entry changed. The dependencies of both
        # lockfiles count, so that a removed dependency counts too.
        affected=$({ git show "$BASE:Cargo.lock" | entries; entries < Cargo.lock; } | jq -nc '
          def closure($graph):
            def grow: [.[], (.[] | ($graph[.] // [])[])] | unique;
            unique | until(. == grow; grow);
          input as $old
          | input as $new
          | ($old + $new
            | map(.name as $name | (.dependencies // [])[] | {key: split(" ")[0], value: $name})
            | group_by(.key) | map({key: .[0].key, value: map(.value)}) | from_entries) as $rdeps
          | [$new[] | select(.source == null) | .name] as $workspace
          | ($old | map(tojson)) as $o
          | ($new | map(tojson)) as $n
          | ($o - $n) + ($n - $o)
          | map(fromjson | .name)
          | closure($rdeps)
          | map(select(IN($workspace[])))')
        echo "packages=$affected" >> "$GITHUB_OUTPUT"

    - name: Find the changed packages
      id: changed-packages
      shell: bash
      env:
        FILES: ${{ steps.changed-files.outputs.files }}
        PACKAGES: ${{ steps.workspace.outputs.packages }}
        PATH_RULES: ${{ steps.rules.outputs.paths }}
        LOCK_PACKAGES: ${{ steps.lock.outputs.packages }}
      run: |
        # For each changed file, the packages of the longest matching path
        # rule, or else the package of the longest package directory that
        # contains the file. Both are null when the file is in no workspace
        # package and no rule matches it. `Cargo.lock` gives the packages that
        # its changes affect.
        mapping=$(jq -c --argjson packages "$PACKAGES" --argjson rules "$PATH_RULES" \
            --argjson lock "$LOCK_PACKAGES" '
          map(. as $file
            | ([$rules | to_entries[] | select(.key as $prefix | $file | startswith($prefix))]
              | max_by(.key | length)) as $rule
            | ([$packages[] | select(.dir as $dir | $file | startswith($dir))]
              | max_by(.dir | length)) as $package
            | {file: ., rule: $rule.value, package: (if $rule then null else $package.name end)}
            | if .file == "Cargo.lock" and .rule == null then .lock = $lock end)' <<< "$FILES")
        jq -r '.[] | "\(.file): \(
          if .rule == [] then "ignored"
          elif .rule then "tests of \(.rule | join(" "))"
          elif .lock then "dependencies of \(.lock | join(" "))"
          else .package // "in no workspace package" end)"' <<< "$mapping"

        # The changed packages, or null for all the packages. A file that
        # nothing maps can affect all the packages. An empty diff also gives
        # all the packages, so that a wrong base cannot skip the tests.
        changed=$(jq -c '
          if . == [] or any(.[]; .rule == null and .package == null and .lock == null) then null
          else [(.[].package // empty), (.[].lock // empty | .[])] | unique end' <<< "$mapping")
        # The packages that path rules give.
        tested=$(jq -c '[.[].rule // empty | .[]] | unique' <<< "$mapping")
        echo "packages=$changed" >> "$GITHUB_OUTPUT"
        echo "tested=$tested" >> "$GITHUB_OUTPUT"

    - name: Find the affected packages
      id: affected
      shell: bash
      env:
        PACKAGES: ${{ steps.workspace.outputs.packages }}
        CHANGED: ${{ steps.changed-packages.outputs.packages }}
        TESTED: ${{ steps.changed-packages.outputs.tested }}
      run: |
        # The changed packages, all the workspace packages that depend on
        # them, and the packages that path rules give. Null is all the
        # packages. Packages can depend on each other in a loop. Thus the step
        # adds the dependents again until it adds no package.
        affected=$(jq -c --argjson packages "$PACKAGES" --argjson tested "$TESTED" '
          def add_dependents:
            . as $set
            | [.[], ($packages[] | select(any(.deps[]; IN($set[]))) | .name)] | unique;
          if . == null then null
          else until(. == add_dependents; add_dependents) + $tested | unique end' <<< "$CHANGED")
        jq -r 'if . == null then "All the packages" elif . == [] then "No packages" else .[] end' <<< "$affected"
        echo "packages=$affected" >> "$GITHUB_OUTPUT"

    - name: Select the tests
      id: select
      shell: bash
      env:
        GROUP_PACKAGES: ${{ steps.rules.outputs.groups }}
        AFFECTED: ${{ steps.affected.outputs.packages }}
      run: |
        selected=$(jq -c --argjson affected "$AFFECTED" '
          map_values(if $affected == null then true else any(.[]; IN($affected[])) end | tostring)' <<< "$GROUP_PACKAGES")
        filter=$(jq -r '
          if . == null then "all()"
          elif . == [] then "none()"
          else map("package(=\(.))") | join(" | ") end' <<< "$AFFECTED")
        jq -r 'to_entries[] | "\(.key): \(.value)"' <<< "$selected"
        echo "Nextest filter: $filter"

        echo "groups=$selected" >> "$GITHUB_OUTPUT"
        echo "nextest-filter=$filter" >> "$GITHUB_OUTPUT"
