name: Select tests
description: >-
  Selects the tests that the changes between a base revision and HEAD can
  affect, from the dependencies between the packages of a Cargo workspace.
  For each changed file, the first of these cases that applies gives the
  affected packages. (1) A path rule or an ignored prefix matches the file:
  the packages of the rule with the longest prefix, without the packages that
  depend on them. (2) The file is the root `Cargo.lock`: the workspace
  packages whose entry changed or that depend, directly or not, on a crate
  whose entry changed, and all the workspace packages that depend on them.
  (3) A workspace package contains the file: that package and all the
  workspace packages that depend on it, through all the dependency kinds
  (also dev-dependencies and optional dependencies). (4) In all other cases,
  for example the root `Cargo.toml`: all the packages. An empty diff also
  affects all the packages. The action needs cargo, jq, python3 and a
  checkout that contains the base revision.
inputs:
  base:
    description: The revision to compare with HEAD.
    required: true
  groups:
    description: >-
      One `<group>=<packages>` line for each test group. `<packages>` is a
      list of workspace packages, with a space between the names. `*` is all
      the workspace packages. Give the packages whose tests the job runs. A
      group is selected when one of its packages is affected.
    required: false
    default: ""
  paths:
    description: >-
      One `<prefix>=<packages>` line for each path rule. `<packages>` has the
      same form as in `groups`. A changed file that starts with `<prefix>`
      affects only the tests of the listed packages: not the packages that
      depend on them, and not the package that contains the file, unless the
      rule lists it. A prefix is plain text, thus end the prefix of a
      directory with `/`. Without a rule, a file in no workspace package
      affects all the packages. Use a rule for files that tests read when they
      run, for example database migrations, and not for files that a package
      compiles.
    required: false
    default: ""
  ignore:
    description: >-
      One path prefix on each line. A changed file with one of these prefixes
      affects no packages. Use it for files that no test reads. When prefixes
      of `paths` and `ignore` match the same file, the longest prefix wins.
    required: false
    default: ""
outputs:
  groups:
    description: >-
      A JSON object with "true" or "false" for each group, for example
      {"driver":"false","e2e":"true"}. A group is "false" only when no changed
      file can affect it.
    value: ${{ steps.select.outputs.groups }}
  nextest-filter:
    description: >-
      A nextest filterset that selects the tests of the affected packages:
      `all()`, `none()` or `package(=<name>) | ...`.
    value: ${{ steps.select.outputs.nextest-filter }}
runs:
  using: composite
  steps:
    - name: List the changed files
      id: changed-files
      shell: bash
      env:
        BASE: ${{ inputs.base }}
      run: |
        # A moved file gives its old path and its new path.
        files=$(git diff --no-renames --name-only "$BASE" HEAD | jq -Rnc '[inputs]')
        jq -r '"\(length) changed files"' <<< "$files"
        echo "files=$files" >> "$GITHUB_OUTPUT"

    - name: Find the workspace packages
      id: workspace
      shell: bash
      run: |
        # The name of each workspace package, its directory relative to the
        # workspace root, and the workspace packages that it depends on. A
        # dependency with a `path` is a workspace package. The `/` at the end
        # of the directory makes sure that `crates/driver/` does not match a
        # file in `crates/driver-old/`.
        packages=$(cargo metadata --no-deps --offline --format-version 1 | jq -c '
          .workspace_root as $root
          | .packages
          | map({
              name,
              dir: (.manifest_path | ltrimstr("\($root)/") | rtrimstr("Cargo.toml")),
              deps: [.dependencies[] | select(.path) | .name]
            })')
        jq -r '"\(length) workspace packages"' <<< "$packages"
        echo "packages=$packages" >> "$GITHUB_OUTPUT"

    - name: Read the groups and the path rules
      id: rules
      shell: bash
      env:
        PACKAGES: ${{ steps.workspace.outputs.packages }}
        GROUP_LINES: ${{ inputs.groups }}
        PATH_LINES: ${{ inputs.paths }}
        IGNORE_LINES: ${{ inputs.ignore }}
      run: |
        rules=$(jq -nc --argjson packages "$PACKAGES" --arg group_lines "$GROUP_LINES" \
            --arg path_lines "$PATH_LINES" --arg ignore_lines "$IGNORE_LINES" '
          # The lines of a text that are not empty.
          def lines: split("\n") | map(select(. != ""));

          # Reads `<key>=<packages>` lines into a list of {key, packages}.
          # `$names` is the names of all the workspace packages.
          def package_lines($names):
            lines | map(
              capture("^(?<key>[^=\\s]+)=(?<packages>[^=]*)$") // error("Not a <key>=<packages> line: \(.)")
              | .packages |= [scan("\\S+") | if . == "*" then $names[] else . end]
              | if .packages == [] then error("\(.key): no packages") end
              | (.packages - $names) as $unknown
              | if $unknown != [] then error("\(.key): not workspace packages: \($unknown | join(" "))") end);

          # Stops when a key is on more than one line.
          def unique_keys:
            (map(.key) | group_by(.) | map(select(length > 1) | .[0])) as $repeated
            | if $repeated != [] then error("On more than one line: \($repeated | join(" "))") end;

          [$packages[].name] as $names
          | {
              group_packages: ($group_lines | package_lines($names) | unique_keys
                | map({key, value: .packages}) | from_entries),
              path_rules: (
                ($path_lines | package_lines($names))
                # An ignored prefix is a path rule with no packages.
                + ($ignore_lines | lines | map(
                    capture("^(?<key>\\S+)$") // error("Not a prefix line: \(.)") | {key, packages: []}))
                | unique_keys
                | map({prefix: .key, packages}))
            }')
        jq -r '"\(.group_packages | length) groups, \(.path_rules | length) path rules"' <<< "$rules"

        group_packages=$(jq -c .group_packages <<< "$rules")
        path_rules=$(jq -c .path_rules <<< "$rules")
        echo "group-packages=$group_packages" >> "$GITHUB_OUTPUT"
        echo "path-rules=$path_rules" >> "$GITHUB_OUTPUT"

    - name: Find the packages that the Cargo.lock changes affect
      id: lock
      shell: bash
      env:
        BASE: ${{ inputs.base }}
      run: |
        # The [[package]] entries of a Cargo.lock as a JSON array.
        entries() {
          python3 -c 'import json, sys, tomllib; json.dump(tomllib.load(sys.stdin.buffer)["package"], sys.stdout)'
        }
        # The workspace packages whose entry changed or that depend, directly
        # or not, on a crate whose entry changed. The dependencies of both
        # lockfiles count, so that a removed dependency counts too.
        lock_packages=$({ git show "$BASE:Cargo.lock" | entries; entries < Cargo.lock; } | jq -nc '
          def closure($graph):
            def grow: [.[], (.[] | ($graph[.] // [])[])] | unique;
            unique | until(. == grow; grow);
          input as $old
          | input as $new
          | ($old + $new
            | map(.name as $name | (.dependencies // [])[] | {key: split(" ")[0], value: $name})
            | group_by(.key) | map({key: .[0].key, value: map(.value)}) | from_entries) as $rdeps
          | [$new[] | select(.source == null) | .name] as $workspace
          | ($old | map(tojson)) as $o
          | ($new | map(tojson)) as $n
          | ($o - $n) + ($n - $o)
          | map(fromjson | .name)
          | closure($rdeps)
          | map(select(IN($workspace[])))')
        echo "lock-packages=$lock_packages" >> "$GITHUB_OUTPUT"

    - name: Find the changed packages
      id: changed-packages
      shell: bash
      env:
        FILES: ${{ steps.changed-files.outputs.files }}
        PACKAGES: ${{ steps.workspace.outputs.packages }}
        PATH_RULES: ${{ steps.rules.outputs.path-rules }}
        LOCK_PACKAGES: ${{ steps.lock.outputs.lock-packages }}
      run: |
        # For each changed file: the packages that it changes (their
        # dependents are also affected), the packages of its path rule (their
        # dependents are not affected), and a text for the log.
        changes=$(jq -c --argjson packages "$PACKAGES" --argjson rules "$PATH_RULES" \
            --argjson lock_packages "$LOCK_PACKAGES" '
          # The item whose prefix is the longest prefix of the file, or null.
          def longest_match($file; prefix):
            map(select(prefix as $prefix | $file | startswith($prefix))) | max_by(prefix | length);

          map(. as $file
            | ($rules | longest_match($file; .prefix)) as $rule
            | ($packages | longest_match($file; .dir)) as $package
            | {file: .} + if $rule and $rule.packages == [] then
                {changed: [], rule_packages: [], effect: "ignored (\($rule.prefix))"}
              elif $rule then
                {changed: [], rule_packages: $rule.packages,
                  effect: "the tests of \($rule.packages | join(" ")) (path rule \($rule.prefix))"}
              elif $file == "Cargo.lock" then
                {changed: $lock_packages, rule_packages: [],
                  effect: "the packages that use the changed entries and their dependents: \(
                    if $lock_packages == [] then "none" else $lock_packages | join(" ") end)"}
              elif $package then
                {changed: [$package.name], rule_packages: [], effect: "\($package.name) and its dependents"}
              else
                {changed: [$packages[].name], rule_packages: [],
                  effect: "all the packages (no path rule and no workspace package)"}
              end)' <<< "$FILES")
        jq -r '.[] | "\(.file): \(.effect)"' <<< "$changes"

        # An empty diff changes all the packages, so that a wrong base cannot
        # skip the tests.
        changed=$(jq -c --argjson packages "$PACKAGES" '
          if . == [] then [$packages[].name] else [.[].changed[]] | unique end' <<< "$changes")
        rule_packages=$(jq -c '[.[].rule_packages[]] | unique' <<< "$changes")
        if [ "$changes" = "[]" ]; then echo "No changed files: all the packages"; fi
        echo "changed=$changed" >> "$GITHUB_OUTPUT"
        echo "rule-packages=$rule_packages" >> "$GITHUB_OUTPUT"

    - name: Find the affected packages
      id: affected
      shell: bash
      env:
        PACKAGES: ${{ steps.workspace.outputs.packages }}
        CHANGED: ${{ steps.changed-packages.outputs.changed }}
        RULE_PACKAGES: ${{ steps.changed-packages.outputs.rule-packages }}
      run: |
        # The changed packages, the packages that depend on them, the
        # packages that depend on those, and so on. Also the packages of the
        # path rules, but not their dependents.
        affected=$(jq -c --argjson packages "$PACKAGES" --argjson rule_packages "$RULE_PACKAGES" '
          # Adds the packages that depend directly on a package in the set.
          def add_dependents:
            . as $set
            | [.[], ($packages[] | select(any(.deps[]; IN($set[]))) | .name)] | unique;
          # Adds dependents until no new package comes. This also stops when
          # packages depend on each other in a loop.
          def with_dependents: until(. == add_dependents; add_dependents);

          (with_dependents + $rule_packages) | unique' <<< "$CHANGED")
        jq -r --argjson packages "$PACKAGES" '
          if length == ($packages | length) then "All the packages"
          elif . == [] then "No packages"
          else .[] end' <<< "$affected"
        echo "affected=$affected" >> "$GITHUB_OUTPUT"

    - name: Select the tests
      id: select
      shell: bash
      env:
        PACKAGES: ${{ steps.workspace.outputs.packages }}
        GROUP_PACKAGES: ${{ steps.rules.outputs.group-packages }}
        AFFECTED: ${{ steps.affected.outputs.affected }}
      run: |
        selected=$(jq -c --argjson affected "$AFFECTED" '
          map_values(any(.[]; IN($affected[])) | tostring)' <<< "$GROUP_PACKAGES")
        filter=$(jq -r --argjson packages "$PACKAGES" '
          if length == ($packages | length) then "all()"
          elif . == [] then "none()"
          else map("package(=\(.))") | join(" | ") end' <<< "$AFFECTED")
        # For a group that is not selected, the log also gives its packages.
        jq -r --argjson affected "$AFFECTED" '
          to_entries[]
          | if any(.value[]; IN($affected[])) then "\(.key): true"
            else "\(.key): false (not affected: \(.value | join(" ")))" end' <<< "$GROUP_PACKAGES"
        echo "Nextest filter: $filter"

        echo "groups=$selected" >> "$GITHUB_OUTPUT"
        echo "nextest-filter=$filter" >> "$GITHUB_OUTPUT"
