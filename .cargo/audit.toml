# cargo-audit configuration

[advisories]
ignore = [
  # ----------------------------------------------------------------
  # Each ignored advisory below is reachable only through a disabled
  # optional dependency. Cargo lists optional deps in Cargo.lock for
  # determinism, so cargo-audit flags them even though the code is
  # never compiled.

  # rsa - Marvin Attack timing sidechannel (RUSTSEC-2023-0071).
  # Pulled in exclusively through `sqlx-mysql`. Unused because we use
  # postgres.
  "RUSTSEC-2023-0071",

  # derivative - Unmaintained (RUSTSEC-2024-0388).
  # Pulled in exclusively through the `ark-ff-03` / `ark-ff-04` optional
  # features of `ruint`.
  "RUSTSEC-2024-0388",

  # ----------------------------------------------------------------
  # Compiled, but no patched version is reachable yet.

  # crypto-bigint 0.5 - Timing variability in constant-time operations
  # (RUSTSEC-2026-0387). Pulled in through `k256` 0.13, which alloy and
  # the Solana secp256k1 crates still require. The fix (0.7.6) needs
  # `k256` 0.14; drop this once they move to it.
  "RUSTSEC-2026-0387",
]
